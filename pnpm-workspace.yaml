packages:
  - "apps/*"
  - "packages/*"

# Build-script decisions. core-js's only postinstall prints a funding notice,
# so we explicitly skip it (Next.js uses SWC and needs no dependency builds).
allowBuilds:
  core-js: false

# posthog-js is newer than the global minimum-release-age policy; allow it.
minimumReleaseAgeExclude:
  - posthog-js@1.430.3
